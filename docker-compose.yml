services:
  db:
    image: postgres:16
    container_name: livedz-db
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livedz -d livedz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
